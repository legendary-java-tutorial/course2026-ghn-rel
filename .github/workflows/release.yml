name: release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install
      - run: npm run build
      - run: npm pack
      - run: gh release create "$GITHUB_REF_NAME" translit-*.tgz --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
